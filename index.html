<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExtraSchool</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div id="app">

        <!--NavBAr-->
        <header class="header">
            <div class="container-header">

                <div class="title-nav">
                    <span class="icon-nav"><i class="fa-solid fa-graduation-cap"></i></span>
                    <h1>ExtraSchool</h1>
                </div>

                <nav>
                    <!-- Checkout button -->
                    <button class="btn" @click="showCheckout()" :disabled="numberofItems === 0">Checkout 🛒
                        {{numberofItems}}</button>
                </nav>
            </div>
        </header>

        <main>
            <!-- Checkout Message -->
            <div v-if="CheckoutMessage">
                <h2>Order Submitted Successfully!</h2>
            </div>
            <!--Form to let the user pick what type of sorting-->
            <div class="container-sort" v-if="showProducts">
                <div class="sort-field">
                    <label>Sort Lesson by</label>
                    <select v-model="sortType">
                        <option value="subject">Subject</option>
                        <option value="location">Location</option>
                        <option value="price">Price</option>
                        <option value="availabilty">Availability</option>
                    </select>
                </div>
                <!--Btn to show lessons in ascending or descending-->
                <div class="btn-sort-container">
                    <button class="btn" @click="decreasing = true">↑</button>
                    <button class="btn" @click="decreasing = false">↓</button>
                </div>
            </div>
            <!--Product page-->
            <div v-if="showProducts">
                <h1>Lessons</h1>
                <div class="lesson-card-container">
                    <div v-for="lesson in sortedLessons" class="lesson-card">
                        <h2>{{lesson.subject}}</h2>
                        <img :src="imageAdress(lesson)" alt="" width="200px" height="150px">
                        <h2>{{lesson.location}}</h2>
                        <h2>Availability: {{lesson.availabilty}}</h2>
                        <h2>{{lesson.price}}</h2>
                        <button class="btn" @click="addToCart(lesson.id)" :disabled="!canAddToCart(lesson)">Add to
                            🛒</button>
                    </div>
                </div>
            </div>
            <!--Checkout Page-->
            <div v-else class="checkout-container">
                <h1>Checkout</h1>
                <!--Checkout Form-->
                <div class="checkout-form">
                    <label for="firstName">First Name:</label>
                    <input id="firstName" v-model="order.firstName" required>
                    <br>
                    <label for="lastName">Last Name:</label>
                    <input id="lastName" v-model="order.lastName" required>
                    <br>
                    <label for="phone">Phone Number:</label>
                    <input id="phone" v-model="order.phone" required>
                    <br>
                    <!--Submit Button-->
                    <button class="btn" @click="postOrder()" :disabled="!formIsValid">Submit Order</button>
                    <br>
                    <!-- Cart Items -->
                    <h2>Items in Cart: {{numberofItems}}</h2>
                    <ul>
                        <li v-for="item in cart">
                            <!--For each item in the cart print subject and price-->
                            {{item.subject}} -
                            {{item.price}} -
                            {{item.location}}
                            <!--Remove Button from cart-->
                            <button class="btn" @click="removeFromCart(item.id)">Remove</button>
                        </li>
                    </ul>
                    <button class="btn" @click="showProducts = true">Home Page</button>
                </div>
            </div>
        </main>

    </div>



    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="script/app.js"></script>
</body>

</html>
