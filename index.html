<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExtraSchool</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div id="app">

        <!--NavBAr-->
        <header class="header">
            <div class="container-header">

                <div class="title-nav">
                    <span class="icon-nav"><i class="fa-solid fa-graduation-cap"></i></span>
                    <h1>ExtraSchool</h1>
                </div>

                <nav>
                    <!-- Checkout button -->
                    <button class="btn" @click="showCheckout()" :disabled="numberofItems === 0">Checkout 🛒
                        {{numberofItems}}</button>
                </nav>
            </div>
        </header>

        <main>
            <div v-if="showProducts">
                <!--Product page-->
                <h1>Lessons</h1>
                <div class="lesson-card-container">
                    <div v-for="lesson in subjects.lesson" :key="lesson.id" class="lesson-card">
                        <h2>{{lesson.subject}}</h2>
                        <img :src="lesson.img" alt="" width="200px" height="150px">
                        <h2>{{lesson.location}}</h2>
                        <h2>Availability: {{lesson.availabilty}}</h2>
                        <h2>{{lesson.price}}</h2>
                        <button class="btn" @click="addToCart(lesson.id)" :disabled="!canAddToCart(lesson)">Add to
                            🛒</button>
                    </div>
                </div>
            </div>
            <!--Checkout Page-->
            <div v-else>
                <h1>Checkout</h1>
                <!--Checkout Form-->
                <label for="firstName">First Name:</label>
                <input id="firstName" v-model="order.firstName" required>
                <br>
                <label for="lastName">Last Name:</label>
                <input id="lastName" v-model="order.lastName" required>
                <br>
                <label for="phone">Phone Number:</label>
                <input id="phone" v-model="order.phone" required>
                <br>
                <!--Submit Button-->
                <button class="btn" @click="showCheckoutMessage()" :disabled="!formIsValid">Submit Order</button>
                <br>
                <!-- Checkout Message -->
                <div v-if="CheckoutMessage">
                    <h2>Order Submitted Successfully!</h2>
                </div>
                <!-- Cart Items -->
                <h2>Items in Cart: {{numberofItems}}</h2>
                <ul>
                    <li v-for="item in cart" :key="item">
                        <!--For each item in the cart print subject and price-->
                        {{item.subject}} -
                        {{item.price}} -
                        {{item.location}}
                        <!--Remove Button from cart-->
                        <button class="btn" @click="removeFromCart(item.id)">Remove</button>
                    </li>
                </ul>
                <button class="btn" @click="showProducts = true">Home Page</button>
            </div>

        </main>

    </div>



    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="script/app.js"></script>
</body>

</html>
